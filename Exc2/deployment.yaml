apiVersion: apps/v1
kind: Deployment
metadata:
  name: 6era-deployment
  labels:
    app: 6era
spec:
  replicas: 1 # Количество подов
  selector:
    matchLabels:
      app: 6era
  template:
    metadata:
      labels:
        app: 6era
    spec:
      containers:
      - name: 6era
        image: shestera/scaletestapp
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "200m"     # Минимальный запрос CPU
            memory: "256Mi" # Минимальный запрос памяти
          limits:
            cpu: "1"      # Лимит на CPU
            memory: "1Gi"  # Лимит на память
---
apiVersion: v1
kind: Service
metadata:
  name: service-6era
spec:
  selector:
    app: 6era
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: NodePort