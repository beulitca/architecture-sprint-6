http {
   # Настройка upstream для балансировки нагрузки
   upstream backend_servers {
       server backend1.example.com;
       server backend2.example.com;
       server backend3.example.com;
   }

   # Определение зоны для ограничения запросов (10 запросов в минуту)
   limit_req_zone $binary_remote_addr zone=one:10m rate=10r/m;

   server {
       listen 80;

       # Применение ограничения запросов для всех локаций на сервере
       location / {
           limit_req zone=one burst=5 nodelay;  # 10 запросов в минуту, с допустимым бурстом в 5 запросов

           proxy_pass http://backend_servers;
       }
   }
}